# dsh-deadline-guard bundle patch
#
# One row: the guard itself. It injects the `tools` registry and wraps
# `tools/execute`, so it needs no other plugin to be present.
#
# Override any value below per profile; the meanings are documented in README.md
# under "Configuration".

- insert:
    - id: deadline-guard
      name: dsh-deadline-guard
      config:
        # Master switch. false unloads the guard without uninstalling the package.
        enabled: true

        # A declaration tighter than the resolved budget wins; a looser one gets
        # clamped. false ignores declarations entirely and always uses the budget.
        respectDeclared: true

        # Once a kind has >= 5 successful samples, use max(p95 * 3, floors[kind]).
        # Set this to false to pin the guard to the budgets table instead.
        adaptive: true

        # Append the measured p50/p95 and the next-step list to a timeout result.
        hints: true

        # Append one JSONL line per call to $DSH_HOME/deadline-guard/calls.jsonl.
        ledger: true

        # Milliseconds a tool gets past its budget before the wrapper stops waiting
        # for it. Only reached by a tool that ignores exec.signal.
        graceMs: 3000

        # Fixed deadlines, used when adaptive is off or a kind has < 5 samples.
        budgets:
          net: 15000
          search: 30000
          read: 15000
          shell: 60000
          build: 180000
          tool: 60000

        # Lower bound for the adaptive rule. Without these, a kind whose samples are
        # all 20ms `cd` calls would get a p95 * 3 of ~60ms and kill the first real
        # command that shares the kind.
        floors:
          net: 10000
          search: 20000
          read: 10000
          shell: 30000
          build: 120000
          tool: 20000

        # Hard cap per kind; anything above is clamped even when declared.
        ceilings:
          net: 30000
          search: 120000
          read: 60000
          shell: 300000
          build: 600000
          tool: 600000
